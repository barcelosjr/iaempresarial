<title>Painel Financeiro — KOBE BH (DRE)</title>
<style>
  :root{
    --bg:#FFFFFF; --sidebar:#000000; --sidebar-hover:#141414; --sidebar-active:#1A1A1A;
    --ink:#111111; --muted-1:#595959; --muted-2:#6B6B6B; --muted-3:#7A7A7A; --muted-4:#9A9A9A; --muted-5:#6B6B6B;
    --border:#E0E0E0; --border-soft:#ECECEC; --subtotal:#F4F4F4; --total-bg:#FBE4E7; --total-ink:#8C0026;
    --accent:#C3002F; --accent-hover:#8C0026; --pos:#5B7553; --neg:#B23B3B; --bar-neutral:#D6D6D6;
    --card-bg:#FFFFFF;
    --serif: Georgia, 'Iowan Old Style', 'Palatino Linotype', 'Times New Roman', serif;
    --sans: 'Segoe UI', Inter, -apple-system, BlinkMacSystemFont, Roboto, Helvetica, Arial, sans-serif;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans)}
  a{color:var(--accent)}
  ::-webkit-scrollbar{height:8px;width:8px}
  ::-webkit-scrollbar-thumb{background:#CCCCCC;border-radius:4px}
  .shell{display:flex;min-height:100vh;background:var(--bg)}

  /* ---- Sidebar ---- */
  .sidebar{width:264px;flex-shrink:0;background:var(--sidebar);color:#fff;display:flex;flex-direction:column;
    padding:28px 20px;gap:26px;position:sticky;top:0;height:100vh;overflow-y:auto}
  .brand-title{font-family:var(--serif);font-size:20px;font-weight:600;letter-spacing:-0.01em}
  .brand-sub{font-size:12px;color:var(--muted-4);margin-top:2px}
  .nav-label{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted-2);margin:0 0 10px}
  .nav-group{display:flex;flex-direction:column;gap:2px;margin-bottom:20px}
  .nav-item{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:8px;cursor:pointer;
    font-size:14px;color:var(--muted-4);background:transparent;border:none;text-align:left;width:100%;font-family:inherit}
  .nav-item:hover{background:var(--sidebar-hover)}
  .nav-item .dot{width:6px;height:6px;border-radius:50%;background:transparent;flex-shrink:0}
  .nav-item.active{background:var(--sidebar-active);color:#fff;font-weight:600}
  .nav-item.active .dot{background:var(--accent)}
  .brand-list{display:flex;flex-direction:column;gap:2px}
  .brand-item{display:flex;align-items:center;gap:10px;padding:8px 12px;border-radius:8px;cursor:pointer;
    font-size:13px;color:var(--muted-4);background:transparent;border:none;text-align:left;width:100%;font-family:inherit}
  .brand-item:hover{background:var(--sidebar-hover)}
  .brand-item .swatch{width:8px;height:8px;border-radius:50%;border:1px solid rgba(255,255,255,.35);flex-shrink:0}
  .brand-item.active{background:var(--sidebar-active);color:#fff;font-weight:600}
  .period-toggle{display:flex;background:var(--sidebar-active);border-radius:8px;padding:3px;gap:2px}
  .period-item{flex:1;text-align:center;padding:6px 4px;border-radius:6px;font-size:12px;cursor:pointer;color:var(--muted-4);
    background:transparent;border:none;font-family:inherit}
  .period-item.active{background:var(--accent);color:#fff;font-weight:600}
  .sidebar-foot{margin-top:auto;font-size:11px;color:var(--muted-2);padding-top:16px;border-top:1px solid #262626}

  /* ---- Main ---- */
  /* Sem max-width: as tabelas de DRE/Fluxo/Balanço têm até 15 colunas (12 meses +
     Acum. + Ano Anterior + Dif.%) e precisam do espaço todo da janela para caber
     sem rolagem horizontal. */
  .main{flex:1;padding:40px 32px;min-width:0}
  .page-head{margin-bottom:28px}
  .page-eyebrow{font-size:12px;color:var(--muted-3);margin-bottom:6px;font-weight:500}
  .page-title{font-family:var(--serif);font-size:32px;font-weight:600;color:var(--ink);text-wrap:balance}
  .page-desc{font-size:14px;color:var(--muted-1);margin-top:6px}

  .toast{display:none;align-items:center;gap:8px;background:#FBE4E7;color:var(--total-ink);border:1px solid #F3C6CE;
    border-radius:8px;padding:10px 14px;font-size:13px;margin-bottom:20px}
  .toast.show{display:flex}

  .kpi-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(225px,1fr));gap:16px;margin-bottom:32px}
  .kpi-card{background:var(--card-bg);border:1px solid var(--border);border-radius:12px;padding:20px 22px;
    display:flex;flex-direction:column;gap:6px;min-width:0;container-type:inline-size}
  .kpi-label{font-size:12.5px;color:var(--muted-1);font-weight:500}
  .kpi-value{font-family:var(--serif);font-size:clamp(15px,8.5cqi,23px);font-weight:600;color:var(--ink);
    font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .kpi-sub{font-size:12px;color:var(--muted-2)}
  .kpi-delta{font-size:12px;font-weight:600}
  .kpi-delta.pos{color:var(--pos)}
  .kpi-delta.neg{color:var(--neg)}

  .section-label{font-size:13px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted-2);
    margin-bottom:14px;font-weight:600}
  .panel{background:var(--card-bg);border:1px solid var(--border);border-radius:12px;padding:22px 24px;margin-bottom:32px}

  .trend-chart{display:flex;gap:14px;align-items:flex-end;height:190px}
  .trend-col{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;height:100%;justify-content:flex-end;min-width:0}
  .trend-bars{width:100%;display:flex;gap:3px;align-items:flex-end;justify-content:center;height:150px}
  .trend-bar{width:42%;border-radius:4px 4px 0 0}
  .trend-bar.rl{background:var(--bar-neutral)}
  .trend-bar.ebitda{background:var(--accent)}
  .trend-bar.ebitda.negative{background:repeating-linear-gradient(135deg, var(--neg), var(--neg) 3px, #fff 3px, #fff 6px)}
  .trend-month{font-size:11px;color:var(--muted-2)}
  .legend{display:flex;gap:20px;margin-top:16px;font-size:12px;color:var(--muted-1);flex-wrap:wrap}
  .legend-item{display:flex;align-items:center;gap:6px}
  .legend-swatch{width:10px;height:10px;border-radius:2px}

  .hbars{display:flex;flex-direction:column;gap:14px}
  .hbar-row{display:flex;align-items:center;gap:12px}
  .hbar-label{width:150px;font-size:13px;color:#333;flex-shrink:0}
  .hbar-track{flex:1;background:#EDEDED;border-radius:6px;height:22px}
  .hbar-fill{height:100%;border-radius:6px}
  .hbar-value{width:110px;text-align:right;font-size:13px;font-variant-numeric:tabular-nums;font-weight:600;flex-shrink:0}

  .footnote{font-size:12px;color:var(--muted-2);margin-top:-18px;margin-bottom:32px}

  .page-updated{font-size:12px;color:var(--muted-2);border-top:1px solid var(--border);
    margin-top:8px;padding-top:14px}

  .placeholder-card{background:var(--card-bg);border:1px dashed var(--border);border-radius:12px;padding:48px 32px;
    text-align:center;color:var(--muted-1);font-size:14px}
  .placeholder-card b{color:var(--ink);display:block;font-family:var(--serif);font-size:18px;font-weight:600;margin-bottom:8px}

  .table-wrap{overflow-x:auto;border:1px solid var(--border);border-radius:12px;background:var(--card-bg);margin-bottom:14px}
  .two-col{display:grid;grid-template-columns:1fr 1fr;gap:24px;align-items:start}
  @media (max-width:800px){ .two-col{grid-template-columns:1fr} }
  table.fin{width:100%;border-collapse:collapse;font-size:12.5px}
  table.fin th{text-align:right;padding:12px 8px;color:var(--muted-1);font-weight:600;border-bottom:1px solid var(--border);white-space:nowrap;font-size:12.5px}
  table.fin th:first-child{text-align:left;position:sticky;left:0;background:var(--card-bg);min-width:175px;padding-left:16px;z-index:1}
  table.fin td{padding:9px 8px;text-align:right;border-bottom:1px solid var(--border-soft);font-variant-numeric:tabular-nums;
    color:#333;white-space:nowrap}
  table.fin td:first-child{text-align:left;position:sticky;left:0;background:var(--card-bg)}
  /* Colunas do ano anterior: mesma tabela, peso visual menor (é referência, não o dado principal). */
  table.fin th.ano-ant, table.fin td.ano-ant{color:var(--muted-1);font-weight:400}
  table.fin tr.subtotal{background:var(--subtotal)}
  table.fin tr.subtotal td{font-weight:700;color:var(--ink)}
  table.fin tr.subtotal td:first-child{background:var(--subtotal)}
  table.fin tr.total{background:var(--total-bg)}
  table.fin tr.total td{font-weight:700;color:var(--total-ink)}
  table.fin tr.total td:first-child{background:var(--total-bg)}
  table.fin td.pct{color:var(--muted-2);font-weight:400;font-size:12px}
  table.fin tr.group td{background:#333333;color:#FFFFFF;font-weight:700;font-size:11.5px;
    text-transform:uppercase;letter-spacing:.03em;padding:9px 16px;border-bottom:1px solid var(--border)}
  /* Título do bloco pode quebrar linha — é o único texto longo o bastante pra
     empurrar a coluna "Conta" inteira e sobrar menos espaço pros meses. */
  table.fin tr.group td:first-child{background:#333333;text-align:left;white-space:normal;line-height:1.3}
  table.fin tr.pct td{font-style:italic;color:var(--muted-1);font-size:12px;background:#FAFAFA}
  table.fin tr.pct td:first-child{background:#FAFAFA}
  table.fin tr.check td{font-size:11.5px;color:var(--muted-2);font-style:italic}
  table.fin tr.check td:first-child{background:var(--card-bg)}
  /* Drill-down da DRE (DESCRICAO_CONTA) — só ROYAL. */
  table.fin tr.normal.expandivel td:first-child{cursor:pointer}
  table.fin tr.normal.expandivel td:first-child:hover{color:var(--accent)}
  .dre-chevron{display:inline-block;width:14px;color:var(--muted-3);font-size:10px}
  table.fin tr.detalhe-sub td{color:var(--muted-2);font-size:12px;background:#FAFAFA}
  table.fin tr.detalhe-sub td:first-child{background:#FAFAFA}
  .callout{background:#FFF7E6;border:1px solid #F0DBA6;color:#7A5B00;border-radius:8px;padding:10px 14px;font-size:13px;margin-bottom:20px}

  /* Glossário dos indicadores: explicação + fórmula + expectativa, padronizado. */
  .glossario{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:12px}
  .glossario-item{border:1px solid var(--border);border-radius:10px;padding:14px 16px;background:var(--card-bg)}
  .glossario-item .g-nome{display:block;font-family:var(--serif);font-size:14px;font-weight:600;color:var(--ink);margin-bottom:5px}
  .glossario-item .g-explicacao{font-size:12.5px;color:#333;line-height:1.45;margin-bottom:8px}
  .glossario-item .g-formula{display:block;font-family:'Courier New',monospace;font-size:11px;color:var(--muted-1);
    background:#F4F4F4;border-radius:5px;padding:5px 8px;margin-bottom:8px;line-height:1.4}
  .glossario-item .g-expectativa{font-size:12px;color:var(--accent);font-weight:600}

  @media (max-width:900px){
    .shell{flex-direction:column}
    .sidebar{width:100%;height:auto;position:relative}
    .main{padding:24px}
  }

  /* Transição de página + entrada escalonada dos KPI cards (testado antes no painel da CORRETORA). */
  @keyframes fadeSlideIn{ from{opacity:0;transform:translateY(8px)} to{opacity:1;transform:translateY(0)} }
  #page-body.page-fade{animation:fadeSlideIn .32s ease-out}
  .kpi-card{animation:fadeSlideIn .38s ease-out backwards}
  .kpi-grid .kpi-card:nth-child(1){animation-delay:.00s}
  .kpi-grid .kpi-card:nth-child(2){animation-delay:.04s}
  .kpi-grid .kpi-card:nth-child(3){animation-delay:.08s}
  .kpi-grid .kpi-card:nth-child(4){animation-delay:.12s}
  .kpi-grid .kpi-card:nth-child(5){animation-delay:.16s}
  .kpi-grid .kpi-card:nth-child(6){animation-delay:.20s}
  @media (prefers-reduced-motion: reduce){
    #page-body.page-fade, .kpi-card{animation:none}
  }
</style>

</div>

  // Monta os 7 meses da DRE detalhada para a selecao atual, somando as empresas escolhidas.
  // `fonte` permite ler o mesmo recorte no ano anterior (DRE_DET_ANT), que e a base
  // das comparacoes periodo a periodo.
  function detalheMeses(brand, fonte){
    var ids = empresasDe(brand);
    var base = fonte || DRE_DET;
    return MESES.map(function(rot, i){
      var o = { m: rot };
      CAMPOS_DRE.forEach(function(k){
        var t = 0;
        ids.forEach(function(id){ var a = base[id] && base[id][k]; if (a) t += a[i]; });
        o[k] = t;
      });
      o.rl = o.vendaVN+o.vendaVU+o.pecas+o.oficina+o.comissoes+o.comSeguros+o.comConsorcios+
             o.comIntermediacao+o.devolucoes+o.impostosVenda;
      o.custoTotal = o.custoVN+o.custoVU+o.custoPecas+o.custoOficina+o.custoTerceiros;
      o.lucroBruto = o.rl + o.custoTotal;

             o.despFuncionamento+o.alugueis+o.despGeraisFunc+o.outrasDesp+o.gastosFunc+
             o.rateioGrupo;
      o.outrasTotal = o.receitasDiversas+o.receitasNaoOper+o.despNaoDedutiveis+o.despNaoOper;
      o.ebitda = o.lucroBruto + o.despTotal + o.outrasTotal;

      o.margemLiq = o.rl ? o.lucro/o.rl : 0;
      return o;
    });
  }

  function balancoNoMes(brand, mesIdx, ano){
    var ids = empresasDe(brand), o = {};

    o.outrasObrig = o.obrigSociais + o.obrigTrib + o.adiantCliente + o.provisoes +
      o.outrasContas + o.lucrosPagar;
    o.totalPassivoCirc = o.fornecedores + o.emprestFinanc + o.outrasObrig;
    o.outrosPNC = o.outrosCredores + o.parcelamentosLP + o.adiantFuturaIntegr;
    o.totalPassivoNaoCirc = o.emprestFinancLP + o.outrosPNC;
    o.totalPL = o.capitalSocial + o.reservasCapital + o.reservasLucros +
      o.reservasIncentivos + o.prejuizosAcum + o.ajustesExercAnt;
    o.totalPassivo = o.totalPassivoCirc + o.totalPassivoNaoCirc;
    o.totalPassivoPL = o.totalPassivo + o.totalPL;
    o.check = o.totalAtivo - o.totalPassivoPL;
    return o;
  }


  // ---- MOVIMENTO MENSAL do Balanco no ANO ANTERIOR (Jan-Jun/2025) ----
  // Serve para reconstruir a posicao patrimonial no fim de cada trimestre de 2025,
  // partindo do saldo de jul/25 e descontando os meses seguintes — o mesmo metodo
  // usado em 2026. Sem isso o Balanco so compararia jul/26 com jul/25.

  // ---- MOVIMENTO MENSAL do Balanco por EMPRESA e conta (Jan-Jun/2026) ----
  // Consulta DAX unica (209 linhas): soma de VALOR_AJUSTADO dentro de cada mes.
  // E a variacao do saldo no mes, que e o insumo do Fluxo de Caixa indireto.

  // Separacao por NATUREZA (D/C), que a formula oficial usa para distinguir
  // venda de ativos de aquisicoes, e para o add-back da depreciacao.

  // ---- RESULTADO CONTABIL por EMPRESA e mes (insumo exclusivo do Fluxo de Caixa) ----
  // Lucro Liquido e depreciacao (NATUREZA=D) apurados so com TIPO_LANCAMENTO=CONTABIL.
  // A DRE do painel continua gerencial (todos os lancamentos); este bloco existe porque
  // o Fluxo de Caixa precisa do resultado contabil para conciliar com o Balanco.

  // Saldo de caixa em 31/12/2025 (acumulado desde 01/2024), ponto de partida do fluxo.

  // Reproduz o Fluxo de Caixa indireto oficial (relatorio_fluxo_caixa) para a selecao atual.
  // Ativos aumentam -> consomem caixa (sinal invertido); passivos aumentam -> geram caixa.
  //
  // Lucro Liquido e Depreciacao saem de FC_CONT: so lancamentos TIPO_LANCAMENTO=CONTABIL,
  // igual a ferramenta oficial. Nenhum lancamento EXTRA tem classificacao de Balanco, entao
  // incluir os extras no resultado faria o fluxo explicar um caixa que nao se moveu — e o
  // CHECK descolaria. As variacoes patrimoniais seguem com todos os lancamentos.
  // Vale so aqui: a DRE e o Balanco do painel nao tem esse recorte.
  function fluxoDe(brand){
    var ids = empresasDe(brand);
    var det = detalheMeses(brand);
    function mov(k, i){ var t=0; ids.forEach(function(id){ var a=MOV[id] && MOV[id][k]; if(a) t+=a[i]; }); return t; }
    function nat(k, i){ var t=0; ids.forEach(function(id){ var a=NAT[id] && NAT[id][k]; if(a) t+=a[i]; }); return t; }
    function cont(k, i){ var t=0; ids.forEach(function(id){ var a=FC_CONT[id] && FC_CONT[id][k]; if(a) t+=a[i]; }); return t; }
    var dispAcum = 0; ids.forEach(function(id){ dispAcum += (SALDO_INI[id]||0); });
    return MESES.map(function(rot, i){
      var o = { m: rot };
      o.lucroExercicio = cont('lucro', i);
      o.da = -cont('depD', i);
      o.varContasReceber = -mov('contasReceber', i);
      o.varCartoes = -mov('cartoesReceber', i);
      o.varFinanciamentos = -mov('financiamentosReceber', i);
      o.varAdiantForn = -mov('adiantForn', i);
      o.varOutrosAdiant = -mov('outrosAdiant', i);
      o.varOutrosCreditos = -mov('outrosCreditos', i);
      o.varImpostosRecuperar = -mov('impostosRecuperar', i);
      o.valoresReceber = o.varContasReceber + o.varCartoes + o.varFinanciamentos +
        o.varAdiantForn + o.varOutrosAdiant + o.varOutrosCreditos + o.varImpostosRecuperar;
      o.varEstVN = -mov('estVN', i); o.varEstVU = -mov('estVU', i); o.varEstPecas = -mov('estPecas', i);
      o.estoque = o.varEstVN + o.varEstVU + o.varEstPecas;
      o.varFornecDiv = mov('fornecDiv', i);
      o.varObrigSociais = mov('obrigSociais', i);
      o.varObrigTrib = mov('obrigTrib', i);
      o.varAdiantCliente = mov('adiantCliente', i);
      o.varProvisoes = mov('provisoes', i);
      o.varOutrasContas = mov('outrasContas', i);
      o.varLucrosPagar = mov('lucrosPagar', i);
      o.valoresPagar = o.varFornecDiv + o.varObrigSociais + o.varObrigTrib + o.varAdiantCliente +
        o.varProvisoes + o.varOutrasContas + o.varLucrosPagar +
        mov('outrosCredores', i) + mov('parcelamentosLP', i);
      o.caixaOperacional = o.lucroExercicio + o.da + mov('ajustesExercAnt', i) +
        o.valoresReceber + o.estoque + o.valoresPagar;

      o.invLP = -(mov('realizavelLP', i) + mov('invLP', i) + mov('invPermanentes', i));
      o.vendaAtivos = -nat('imobC', i) - nat('acumD', i);
      o.adicoesAtivo = -nat('imobD', i);
      o.caixaInvestimento = o.invLP + o.vendaAtivos + o.adicoesAtivo;

      o.varEmprestimos = mov('emprestBancarios', i) + mov('emprestTerceiros', i) +
        mov('contaGarantida', i) + mov('financiamentos', i) + mov('notasComerciais', i) +
        mov('emprestFinancLP', i);
      o.varFPNovos = mov('floorVN', i); o.varFPUsados = mov('floorVU', i); o.varFPPecas = mov('floorPecas', i);
      o.varCapital = mov('capitalSocial', i) + mov('reservasCapital', i);
      o.caixaFinanciamento = o.varEmprestimos + o.varFPNovos + o.varFPUsados + o.varFPPecas +
        o.varCapital + mov('adiantFuturaIntegr', i);

      o.variacaoLiquida = o.caixaOperacional + o.caixaInvestimento + o.caixaFinanciamento;
      // Igual a ferramenta oficial: o saldo inicial de cada mes vem do Balanco acumulado ate o mes
      // anterior — nao do saldo final calculado. Assim o CHECK de um mes nao contamina o seguinte.
      o.saldoInicial = dispAcum;
      o.saldoFinal = o.saldoInicial + o.variacaoLiquida;
      dispAcum += mov('caixaBancos', i) + mov('aplicacoesFinanceiras', i);
      o.dispReferencia = dispAcum;
      o.check = o.saldoFinal - dispAcum;
      return o;
    });
  }

  // ---- Agrupamento por período (Mensal / Trimestral / Anual) ----
  // Os dados-fonte são sempre mensais, Jan até o último mês carregado do ano
  // selecionado (aplicarAno define MESES). Trimestral e Anual agregam esses meses;
  // nada é reconsultado. O "*" marca grupo/ano ainda incompleto — com 12 meses
  // (ano fechado) ele não aparece; com 6 (ano em curso) aparece no rótulo anual.
  function gruposDoPeriodo(){
    var n = MESES.length;
    if (state.period === 'anual'){
      var anoCompleto = (n === 12);
      return [{ label: anoAtual() + (anoCompleto ? '' : '*'), idx: MESES.map(function(_,i){ return i; }),
                titulo:'Jan–'+MESES[n-1]+'/'+anoAtual() }];
    }
    if (state.period === 'trimestral'){
      var out = [], t = 1;
      for (var i = 0; i < n; i += 3){
        var idx = [];
        for (var j = i; j < Math.min(i+3, n); j++) idx.push(j);
        var completo = idx.length === 3;
        out.push({ label:'T'+t+'/'+anoAtual().slice(2) + (completo ? '' : '*'), idx: idx,
                   titulo: MESES[idx[0]]+'–'+MESES[idx[idx.length-1]]+'/'+anoAtual() });
        t++;
      }
      return out;
    }
    return MESES.map(function(rot, i){
      return { label: rot+'/'+anoAtual().slice(2), idx:[i], titulo: rot+'/'+anoAtual() };
    });
  }

  // Rótulo curto do modo, usado nos títulos das seções.
  function rotuloPeriodo(){
    return state.period === 'anual' ? 'anual'
         : state.period === 'trimestral' ? 'trimestral' : 'mensal';
  }

  // Soma os meses de cada grupo. `campos` são somados; as margens são recalculadas
  // sobre os totais do grupo (média de margens não é margem do período).
  function agruparDre(meses){
    var campos = CAMPOS_DRE.concat(['rl','custoTotal','lucroBruto','despTotal',
      'outrasTotal','ebitda','ebit','lair','lucro']);
    return gruposDoPeriodo().map(function(g){
      var o = { m: g.label, _titulo: g.titulo };
      campos.forEach(function(k){
        o[k] = g.idx.reduce(function(t,i){ return t + (meses[i][k] || 0); }, 0);
      });
      o.margemBruta  = o.rl ? o.lucroBruto/o.rl : 0;
      o.margemEbitda = o.rl ? o.ebitda/o.rl : 0;
      o.margemLiq    = o.rl ? o.lucro/o.rl : 0;
      return o;
    });
  }

  // Mesmo agrupamento por período de agruparDre + comAcumulado, mas para um único
  // vetor mensal de DESCRICAO_CONTA (drill-down da DRE — ver DRE_DESC). O resultado
  // tem o mesmo comprimento de `atuais` em renderDrePage, célula a célula.
  function agruparDesc(descArr){
    var porGrupo = gruposDoPeriodo().map(function(g){
      return g.idx.reduce(function(t,i){ return t + (descArr[i] || 0); }, 0);
    });
    if (porGrupo.length > 1) {
      porGrupo.push(descArr.reduce(function(t,v){ return t + (v || 0); }, 0));
    }
    return porGrupo;
  }

  // Soma total de um vetor mensal de DESCRICAO_CONTA — usado para o comparativo do
  // ano anterior no drill-down, que não é agrupado por período (só o acumulado importa).
  function somaTudo(arr){ return (arr || []).reduce(function(t,v){ return t + (v || 0); }, 0); }

  // Fluxo de caixa: as variações são somadas, mas os saldos não — o saldo inicial do
  // grupo é o do primeiro mês e a referência do Balanço é a do último. O CHECK é
  // recalculado sobre o grupo, mantendo a divergência à mostra.
  function agruparFluxo(fluxos){
    var somaveis = Object.keys(fluxos[0]).filter(function(k){
      return k !== 'm' && k !== 'saldoInicial' && k !== 'saldoFinal' &&
             k !== 'dispReferencia' && k !== 'check';
    });
    return gruposDoPeriodo().map(function(g){
      var o = { m: g.label, _titulo: g.titulo };
      somaveis.forEach(function(k){
        o[k] = g.idx.reduce(function(t,i){ return t + (fluxos[i][k] || 0); }, 0);
      });
      var primeiro = fluxos[g.idx[0]], ultimo = fluxos[g.idx[g.idx.length-1]];
      o.saldoInicial = primeiro.saldoInicial;
      o.saldoFinal = o.saldoInicial + o.variacaoLiquida;
      o.dispReferencia = ultimo.dispReferencia;
      o.check = o.saldoFinal - o.dispReferencia;
      return o;
    });
  }

  function sum(list, key){ return list.reduce(function(s,o){return s+o[key];}, 0); }
  function somaArrays(arrs){
    var n = arrs[0].length, out = [];
    for (var i=0;i<n;i++){ var t=0; for (var j=0;j<arrs.length;j++) t += arrs[j][i]; out.push(t); }
    return out;
  }
  function empresasDe(brand){ return brand === 'all' ? EMPRESAS.map(function(e){return e.id;}) : [brand]; }

  // Reconstrói os subtotais da DRE a partir dos 8 blocos, na mesma ordem da ferramenta oficial.
  function dreCalc(a, label){
    var lucroBruto = a[0] + a[1];
    var ebitda = lucroBruto + a[2] + a[3];
    var ebit = ebitda + a[4];
    var lair = ebit + a[5] + a[6];
    return { label:label, rl:a[0], custos:a[1], despesas:a[2], outras:a[3], deprec:a[4],
      recFin:a[5], despFin:a[6], irCsll:a[7],
      lucroBruto:lucroBruto, ebitda:ebitda, ebit:ebit, lair:lair, lucro:lair + a[7],
      margemBruta: a[0] ? lucroBruto/a[0] : 0, margemEbitda: a[0] ? ebitda/a[0] : 0,
      margemLiq: a[0] ? (lair + a[7])/a[0] : 0 };
  }
  function balCalc(a){
    var ativoCirc = a[0] + a[1] + a[2];
    var ativoTotal = ativoCirc + a[3];
    var passivoCirc = a[4] + a[5] + a[6] + a[7];
    var passivoNaoCirc = a[8] + a[9];
    return { disponibilidades:a[0], valoresReceber:a[1], estoques:a[2], ativoNaoCirc:a[3],
      floorPlan:a[4], fornecDiversos:a[5], emprestFinanc:a[6], outrasObrig:a[7],
      emprestFinancLP:a[8], outrosPNC:a[9], totalPL:a[10],
      totalAtivoCirc:ativoCirc, totalAtivo:ativoTotal,
      totalPassivoCirc:passivoCirc, totalPassivoNaoCirc:passivoNaoCirc,
      totalPassivo:passivoCirc + passivoNaoCirc,
      totalPassivoPL:passivoCirc + passivoNaoCirc + a[10],
      check: ativoTotal - (passivoCirc + passivoNaoCirc + a[10]) };
  }

  // ---- Contexto recalculado a cada troca de empresa ----
  var dreMeses, curYtd, priorYtd, bal, balP;
  var margemEbitdaCur, margemEbitdaPrior, margemLiqCur, margemLiqPrior;
  var roeCur, roePrior, dividaEbitdaCur, dividaEbitdaPrior, kpiCards;

  function recomputar(brand){
    var ids = empresasDe(brand);
    // Fonte unica da DRE: DRE_DET (detalhe conta a conta). Os 8 blocos usados nos KPIs sao
    // derivados dela, para que tabela e indicadores nunca divirjam.
    function blocos(o){ return [o.rl,o.custoTotal,o.despTotal,o.outrasTotal,o.da,o.recFin,o.despFin,o.irCsll]; }
    var _det = detalheMeses(brand);
    dreMeses = _det.map(function(o){ return dreCalc(blocos(o), o.m); });
    curYtd = dreCalc(somaArrays(_det.map(blocos)), 'Acumulado');
    // Ano anterior: mesmos meses de DRE_DET_ANT (ver aplicarAno) — Jan..mesFinalRotulo()
    // do ano anterior ao selecionado, nunca o acumulado inteiro daquele ano.
    var _detAnt = detalheMeses(brand, DRE_DET_ANT);
    priorYtd = dreCalc(somaArrays(_detAnt.map(blocos)), 'Acumulado ' + anoAnterior());
    bal  = balancoDe(brand, 0);
    balP = balancoDe(brand, 1);

    margemEbitdaCur = curYtd.margemEbitda;   margemEbitdaPrior = priorYtd.margemEbitda;
    margemLiqCur    = curYtd.margemLiq;      margemLiqPrior    = priorYtd.margemLiq;
    roeCur   = bal.totalPL  ? curYtd.lucro   / bal.totalPL  : 0;
    roePrior = balP.totalPL ? priorYtd.lucro / balP.totalPL : 0;

    var divLiqCur   = (bal.emprestFinanc  + bal.emprestFinancLP)  - bal.disponibilidades;
    var divLiqPrior = (balP.emprestFinanc + balP.emprestFinancLP) - balP.disponibilidades;
    dividaEbitdaCur   = curYtd.ebitda   ? divLiqCur   / curYtd.ebitda   : 0;
    dividaEbitdaPrior = priorYtd.ebitda ? divLiqPrior / priorYtd.ebitda : 0;

    kpiCards = [
      { label:'Receita Líquida', value: fmtBRL(curYtd.rl), sub:janAte(anoAtual())+' (acumulado no ano)',
        delta: fmtChangePct(curYtd.rl, priorYtd.rl), positive: curYtd.rl >= priorYtd.rl },
      { label:'EBITDA', value: fmtBRL(curYtd.ebitda), sub:'Margem '+fmtPct(margemEbitdaCur),
        delta: fmtChangePct(curYtd.ebitda, priorYtd.ebitda), positive: curYtd.ebitda >= priorYtd.ebitda },
      { label:'Lucro Líquido', value: fmtBRL(curYtd.lucro), sub:'Margem '+fmtPct(margemLiqCur),
        delta: 'ante '+fmtBRL(priorYtd.lucro)+' em '+anoAnterior(), positive: curYtd.lucro >= priorYtd.lucro },
      { label:'Caixa (Disponibilidades)', value: fmtBRL(bal.disponibilidades), sub:'Posição em '+periodoRef(),
        delta: 'ante '+fmtBRL(balP.disponibilidades)+' em '+mesFinalRotulo().toLowerCase()+'/'+anoAnterior().slice(2), positive: bal.disponibilidades >= balP.disponibilidades },
      { label:'ROE (Retorno sobre o Patrimônio Líquido)', value: fmtPct(roeCur), sub:'Lucro líq. acumulado / PL atual',
        delta: fmtPP(roeCur, roePrior), positive: roeCur >= roePrior },
      { label:'Dívida Líquida / EBITDA', value: fmtRatioPrecise(dividaEbitdaCur), sub:'Sem floor plan · EBITDA acumulado no ano',
        delta: fmtChangePct(dividaEbitdaCur, dividaEbitdaPrior), positive: dividaEbitdaCur <= dividaEbitdaPrior }
    ];
  }

  // DRE mensal DETALHADA consolidada, jan–jul/2026 (query: relatorio_dre, modo=mensal, todas as contas)
  // Convenção oficial (igual à ferramenta relatorio_dre): custos/despesas/deduções aparecem como
  // número POSITIVO nas linhas de detalhe (o "(-)" no rótulo já indica o sentido); só os subtotais
  // carregam o sinal econômico real.


  // Fluxo de Caixa mensal (método indireto), consolidado, jan–jul/2026
  // (query: relatorio_fluxo_caixa, modo=mensal). "Ajustes de Exercícios Anteriores", "Outros Ajustes",
  // "Outros Credores" e "Parcelamentos LP" foram omitidos da tabela por ficarem zerados o período inteiro.
  // O "Lucro Líquido do Exercício" usado aqui é o que a própria ferramenta de fluxo de caixa recalcula —
  // em alguns meses ele diverge um pouco do valor da DRE, porque a base apura o resultado por trimestre
  // (ver aviso mais abaixo). Não escondemos essa diferença.

  var cfRowDefs = [
    {label:'Lucro Líquido do Exercício', kind:'normal', indent:1, get:function(m){return m.lucroExercicio;}},
    {label:'(+) Depreciação e Amortização', kind:'normal', indent:1, get:function(m){return m.da;}, isRevenue:true},
    {label:'(+/-) Variação em Contas a Receber', kind:'normal', indent:1, get:function(m){return m.varContasReceber;}},
    {label:'(+/-) Variação em Cartões de Crédito a Receber', kind:'normal', indent:1, get:function(m){return m.varCartoes;}},
    {label:'(+/-) Variação em Financiamentos a Receber', kind:'normal', indent:1, get:function(m){return m.varFinanciamentos;}},
    {label:'(+/-) Variação em Adiantamentos a Fornecedores', kind:'normal', indent:1, get:function(m){return m.varAdiantForn;}},
    {label:'(+/-) Variação em Outros Adiantamentos', kind:'normal', indent:1, get:function(m){return m.varOutrosAdiant;}},
    {label:'(+/-) Variação em Outros Créditos a Receber', kind:'normal', indent:1, get:function(m){return m.varOutrosCreditos;}},
    {label:'(+/-) Variação em Impostos a Recuperar', kind:'normal', indent:1, get:function(m){return m.varImpostosRecuperar;}},
    {label:'= Valores a Receber', kind:'subtotal', indent:0, get:function(m){return m.valoresReceber;}},
    {label:'(+/-) Variação em Estoque de Veículos Novos', kind:'normal', indent:1, get:function(m){return m.varEstVN;}},
    {label:'(+/-) Variação em Estoque de Veículos Usados', kind:'normal', indent:1, get:function(m){return m.varEstVU;}},
    {label:'(+/-) Variação em Estoque de Peças', kind:'normal', indent:1, get:function(m){return m.varEstPecas;}},
    {label:'= Estoque', kind:'subtotal', indent:0, get:function(m){return m.estoque;}},
    {label:'(+/-) Variação em Fornecedores Diversos', kind:'normal', indent:1, get:function(m){return m.varFornecDiv;}},
    {label:'(+/-) Variação em Obrigações Sociais e Trabalhistas', kind:'normal', indent:1, get:function(m){return m.varObrigSociais;}},
    {label:'(+/-) Variação em Obrigações Tributárias e Diversas', kind:'normal', indent:1, get:function(m){return m.varObrigTrib;}},
    {label:'(+/-) Variação em Adiantamento de Clientes', kind:'normal', indent:1, get:function(m){return m.varAdiantCliente;}},
    {label:'(+/-) Variação em Provisões', kind:'normal', indent:1, get:function(m){return m.varProvisoes;}},
    {label:'(+/-) Variação em Outras Contas a Pagar', kind:'normal', indent:1, get:function(m){return m.varOutrasContas;}},
    {label:'(+/-) Variação em Lucros a Pagar', kind:'normal', indent:1, get:function(m){return m.varLucrosPagar;}},
    {label:'= Valores a Pagar', kind:'subtotal', indent:0, get:function(m){return m.valoresPagar;}},
    {label:'= Caixa Gerado nas Atividades Operacionais', kind:'total', indent:0, get:function(m){return m.caixaOperacional;}},
    {label:'(+/-) Investimentos a Longo Prazo', kind:'normal', indent:1, get:function(m){return m.invLP;}},
    {label:'(+) Venda de Ativos Imobilizados', kind:'normal', indent:1, get:function(m){return m.vendaAtivos;}, isRevenue:true},
    {label:'(-) Adições ao Ativo Imobilizado (Capex)', kind:'normal', indent:1, get:function(m){return m.adicoesAtivo;}},
    {label:'= Caixa das Atividades de Investimento', kind:'total', indent:0, get:function(m){return m.caixaInvestimento;}},
    {label:'(+/-) Empréstimos e Financiamentos', kind:'normal', indent:1, get:function(m){return m.varEmprestimos;}},
    {label:'(+/-) Variação em Floor Plan de Veículos Novos', kind:'normal', indent:1, get:function(m){return m.varFPNovos;}},
    {label:'(+/-) Variação em Floor Plan de Veículos Usados', kind:'normal', indent:1, get:function(m){return m.varFPUsados;}},
    {label:'(+/-) Variação em Floor Plan de Peças', kind:'normal', indent:1, get:function(m){return m.varFPPecas;}},
    {label:'(+/-) Variação de Capital', kind:'normal', indent:1, get:function(m){return m.varCapital;}},
    {label:'= Caixa das Atividades de Financiamento', kind:'total', indent:0, get:function(m){return m.caixaFinanciamento;}},
    {label:'= Variação Líquida de Caixa no Período', kind:'total', indent:0, get:function(m){return m.variacaoLiquida;}},
    {label:'(+) Saldo de Caixa Inicial do Período', kind:'normal', indent:1, get:function(m){return m.saldoInicial;}, isRevenue:true},
    {label:'(=) Saldo de Caixa Final do Período', kind:'total', indent:0, get:function(m){return m.saldoFinal;}},
    {label:'CHECK: Saldo Final − Disponibilidades do Balanço', kind:'check', indent:0, get:function(m){return m.check;}}
  ];

  // Balanço Patrimonial consolidado (query: relatorio_balanco) — posição acumulada desde 01/2024 até o período.

  // ---------- Formatting helpers (tudo em número inteiro, sem casas decimais) ----------
  function noNegZero(n){ return n === 0 ? 0 : n; }
  function fmtBRL(v){
    var sign = v < 0 ? '-' : '';
    var abs = Math.abs(v);
    return sign + 'R$ ' + Math.round(abs).toLocaleString('pt-BR');
  }
  function fmtPct(v){ return noNegZero(Math.round(v*100)).toLocaleString('pt-BR') + '%'; }
  // Variação ano a ano: 1 casa decimal. Arredondar para inteiro esconderia meio
  // ponto de diferença numa coluna que existe justamente para medir a variação.
  function fmtDeltaPct(v){
    var p = noNegZero(v*100);
    return (p >= 0 ? '+' : '') + p.toLocaleString('pt-BR',
      {minimumFractionDigits:1, maximumFractionDigits:1}) + '%';
  }
  function fmtRatio(v){ return Math.round(v) + 'x'; }
  // Índices de liquidez ficam quase todos entre 0 e 2 — arredondar para inteiro (0x/1x) apagaria a informação
  // (ex.: 0,38x viraria "0x", parecendo iliquidez total). Por isso, só aqui, mantemos 2 casas decimais.
  function fmtRatioPrecise(v){ return v.toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2}) + 'x'; }
  function fmtChangePct(cur,prior){ var d=(cur-prior)/Math.abs(prior||1); var r=noNegZero(Math.round(d*100)); var s=r>=0?'+':''; return s+r.toLocaleString('pt-BR')+'%'; }
  function fmtPP(curFrac,priorFrac){ var d=(curFrac-priorFrac)*100; var r=noNegZero(Math.round(d)); var s=r>=0?'+':''; return s+r.toLocaleString('pt-BR')+' p.p.'; }
  function fmtDays(v){ return Math.round(v) + ' dias'; }
  function fmtDiffDays(cur,prior){ var d=Math.round(cur-prior); var s=d>=0?'+':''; return s+d+' dias'; }

  function renderTrendChart(){
    var wrap = document.createElement('div');
    var maxRl = Math.max.apply(null, dreMeses.map(function(m){return m.rl;}));

    wrap.appendChild(el('<div class="section-label">Evolução mensal — Receita Líquida e EBITDA (real)</div>'));
    var panel = document.createElement('div'); panel.className = 'panel';
    var chart = document.createElement('div'); chart.className = 'trend-chart';

    dreMeses.forEach(function(m){
      var rlPct = Math.max(m.rl/maxRl*100, 2);
      var ebitdaPct = Math.max(Math.abs(m.ebitda)/maxRl*100, 2);
      var col = document.createElement('div'); col.className = 'trend-col';
      var bars = document.createElement('div'); bars.className = 'trend-bars';
      var rlBar = document.createElement('div'); rlBar.className='trend-bar rl'; rlBar.style.height=rlPct+'%';
      rlBar.title = 'Receita Líquida '+m.label+'/'+anoAtual()+': '+fmtBRL(m.rl);
      var ebBar = document.createElement('div'); ebBar.className='trend-bar ebitda'+(m.ebitda<0?' negative':''); ebBar.style.height=ebitdaPct+'%';
      ebBar.title = 'EBITDA '+m.label+'/'+anoAtual()+': '+fmtBRL(m.ebitda);
      bars.appendChild(rlBar); bars.appendChild(ebBar);
      col.appendChild(bars);
      col.appendChild(el('<div class="trend-month">'+m.label+'</div>'));
      chart.appendChild(col);
    });
    panel.appendChild(chart);
    var legend = el('<div class="legend"></div>');
    legend.appendChild(el('<div class="legend-item"><div class="legend-swatch" style="background:#D6D6D6"></div>Receita Líquida</div>'));
    legend.appendChild(el('<div class="legend-item"><div class="legend-swatch" style="background:#C3002F"></div>EBITDA (hachurado = negativo)</div>'));
    panel.appendChild(legend);
    wrap.appendChild(panel);
    wrap.appendChild(el('<div class="footnote">Fonte: Lançamentos Contábeis e Gerenciais.</div>'));
    return wrap;
  }

        delta: 'ante '+fmtBRL(priorYtd.lucro)+' em '+anoAnterior(), positive: curYtd.lucro >= priorYtd.lucro }
    ];
    body.appendChild(renderKpiGrid(kpi1));

    // Cada período do ano corrente vem seguido do mesmo período do ano anterior — a
    // comparação é sempre contra o período equivalente, nunca contra o anterior.
    function comAcumulado(lista){
      if (lista.length <= 1) return lista;      // no anual a soma repetiria a coluna
      var a = { m:'Acum.' };
      CAMPOS_DRE.concat(['rl','custoTotal','lucroBruto','despTotal','outrasTotal',
        'ebitda','ebit','lair','lucro']).forEach(function(k){
        a[k] = lista.reduce(function(t,m){ return t + m[k]; }, 0);
      });
      a.margemBruta  = a.rl ? a.lucroBruto/a.rl : 0;
      a.margemEbitda = a.rl ? a.ebitda/a.rl : 0;
      a.margemLiq    = a.rl ? a.lucro/a.rl : 0;
      return lista.concat([a]);
    }

    var atuais     = comAcumulado(agruparDre(detalheMeses(state.brand)));
    var anteriores = comAcumulado(agruparDre(detalheMeses(state.brand, DRE_DET_ANT)));

    // Os períodos do ano corrente ficam limpos, um por coluna. A comparação com
    // o ano anterior entra só no fim: total do ano anterior e a diferença percentual.
    var totalAtual = atuais[atuais.length - 1];
    var totalAnt   = anteriores[anteriores.length - 1];

    var cols = [], anoAnt = [];
    atuais.forEach(function(m){
      m.outrasTotalNeg = -m.outrasTotal;      // cabeçalho do bloco 4, na convenção de exibição
      m.resFinNeg = -(m.recFin + m.despFin);  // cabeçalho do bloco 6
      cols.push(m); anoAnt.push(false);
    });
    totalAnt.outrasTotalNeg = -totalAnt.outrasTotal;
    totalAnt.resFinNeg = -(totalAnt.recFin + totalAnt.despFin);
    cols.push(totalAnt); anoAnt.push(true);
    // Última coluna: variação % do acumulado do ano atual contra o mesmo período do ano anterior.
    var colDelta = cols.length;

    var quem = isAll() ? 'Consolidado' : state.brand;
    var titulo = 'Demonstrativo de Resultado — ' + quem + ', ' + rotuloPeriodo() +
                 ' (' + janAte(anoAtual()) + ' vs ' + anoAnterior() + ')';
    body.appendChild(el('<div class="section-label">'+titulo+'</div>'));

    // Rótulo do acumulado do ano anterior: 'Acum./25' quando há vários períodos,
    // '2025' no modo anual (onde a única coluna já é o próprio acumulado).
    var anoAntSufixo = anoAnterior().slice(2), anoAtualSufixo = anoAtual().slice(2);
    var rotAnt = (atuais.length > 1) ? ('Acum./'+anoAntSufixo) : anoAnterior();

    var tableWrap = document.createElement('div'); tableWrap.className = 'table-wrap';
    var table = document.createElement('table'); table.className = 'fin';
    table.innerHTML = '<thead><tr><th>Conta</th>' +
      atuais.map(function(m){
        return '<th>'+(m.m === 'Acum.' ? ('Acum./'+anoAtualSufixo) : m.m)+'</th>';
      }).join('') +
      '<th class="ano-ant">'+rotAnt+'</th><th class="ano-ant">Dif. %</th></tr></thead>';

    var tbody = document.createElement('tbody');
    dreEstrutura(state.brand).forEach(function(row){
      var tr = document.createElement('tr');
      tr.className = row.kind;
      var cells;
      var cls = function(i){ return anoAnt[i] ? ' class="ano-ant"' : ''; };
      // Variação do acumulado do ano atual contra o mesmo período do ano anterior.
      // Em % sobre a base do ano anterior; sem base (zerado) não há percentual a mostrar.
      // `invert` espelha o sinal invertido do valor exibido (linhas de custo/despesa e
      // os cabeçalhos de bloco) — senão a % sai com o sinal econômico bruto, que anda
      // ao contrário do número mostrado (ex.: despesa que cresceu de R$15M pra R$18M
      // mostrando "-23,5%" porque o valor bruto ficou mais negativo).
      function celDelta(k, invert){
        if (!k) return '<td class="ano-ant"></td>';
        var a = totalAtual[k], b = totalAnt[k];
        if (invert) { a = -a; b = -b; }
        if (!b) return '<td class="ano-ant">–</td>';
        return '<td class="ano-ant">'+fmtDeltaPct((a - b) / Math.abs(b))+'</td>';
      }
      if (row.kind === 'group') {
        // O cabeçalho do bloco pode carregar um subtotal só de exibição (blocos 3, 4 e 6).
        cells = '<td>'+row.label+'</td>';
        cols.forEach(function(m, i){
          cells += '<td'+cls(i)+'>' + (row.k ? fmtBRL(-m[row.k]) : '') + '</td>';
        });
        cells += celDelta(row.k, true);
      } else if (row.kind === 'pct') {
        // Margens: a diferença é em pontos percentuais, não variação relativa.
        cells = '<td style="padding-left:34px">'+row.label+'</td>';
        cols.forEach(function(m, i){ cells += '<td'+cls(i)+'>'+fmtPct(m[row.k])+'</td>'; });
        var pp = (totalAtual[row.k] - totalAnt[row.k]) * 100;
        cells += '<td class="ano-ant">'+(pp >= 0 ? '+' : '')+pp.toFixed(1).replace('.',',')+' p.p.</td>';
      } else {
        var recuo = (row.kind === 'normal') ? 34 : 16;
        var desc = row.kind === 'normal' ? DRE_DESC[row.k] : null;
        var aberto = !!(desc && state.dreExpandido[row.k]);
        var rotulo = desc
          ? '<span class="dre-chevron">'+(aberto ? '▾' : '▸')+'</span>'+row.label
          : row.label;
        if (desc) tr.className += ' expandivel';
        cells = '<td style="padding-left:'+recuo+'px">'+rotulo+'</td>';
        cols.forEach(function(m, i){
          var v = m[row.k];
          // Linhas subtrativas aparecem com o sinal invertido, igual ao relatório oficial:
          // um custo (negativo na base) sai positivo; um estorno sai negativo.
          var mostrado = (row.kind === 'normal' && !row.receita) ? -v : v;
          cells += '<td'+cls(i)+'>'+fmtBRL(mostrado)+'</td>';
        });
        cells += celDelta(row.k, row.kind === 'normal' && !row.receita);
      }
      tr.innerHTML = cells;
      if (row.kind === 'normal' && DRE_DESC[row.k]) {
        tr.querySelector('td:first-child').onclick = function(){
          state.dreExpandido[row.k] = !state.dreExpandido[row.k];
          render();
        };
      }
      tbody.appendChild(tr);

      // Drill-down: DESCRICAO_CONTA por trás desta conta (ver DRE_DESC/DRE_DESC_ANT).
      // O ano anterior aqui é sempre o acumulado do período equivalente (não dá pra
      // agrupar por mês/trimestre — só o total do período importa na comparação).
      if (row.kind === 'normal' && DRE_DESC[row.k] && state.dreExpandido[row.k]) {
        var recuoSub = 34 + 18;
        Object.keys(DRE_DESC[row.k]).sort().forEach(function(descLabel){
          var listaAtual = agruparDesc(DRE_DESC[row.k][descLabel]);
          var totalAtualDesc = listaAtual[listaAtual.length - 1];
          var arrAnt = DRE_DESC_ANT[row.k] && DRE_DESC_ANT[row.k][descLabel];
          var totalAntDesc = arrAnt ? somaTudo(arrAnt) : 0;
          var subVals = listaAtual.concat([totalAntDesc]);
          var subTr = document.createElement('tr');
          subTr.className = 'detalhe-sub';
          var subCells = '<td style="padding-left:'+recuoSub+'px">'+descLabel+'</td>';
          cols.forEach(function(m, i){
            var mostrado = row.receita ? subVals[i] : -subVals[i];
            subCells += '<td'+cls(i)+'>'+fmtBRL(mostrado)+'</td>';
          });
          var invert = row.kind === 'normal' && !row.receita;
          var a = totalAtualDesc, b = totalAntDesc;
          if (invert) { a = -a; b = -b; }
          subCells += b ? '<td class="ano-ant">'+fmtDeltaPct((a - b) / Math.abs(b))+'</td>' : '<td class="ano-ant">–</td>';
          subTr.innerHTML = subCells;
          tbody.appendChild(subTr);
        });
      }
    });
    table.appendChild(tbody);
    tableWrap.appendChild(table);
    body.appendChild(tableWrap);

  }

      : ('O CHECK do fluxo de caixa fecha em zero em todos os meses de '+anoAtual()+': o saldo acumulado por este '

  function renderBalancoPage(){
    var body = document.getElementById('page-body');
    body.innerHTML = '';

    var workingCapitalCur = bal.totalAtivoCirc - bal.totalPassivoCirc;
    var workingCapitalPrior = balP.totalAtivoCirc - balP.totalPassivoCirc;
    var dividaFinCur = bal.emprestFinanc + bal.emprestFinancLP;
    var dividaFinPrior = balP.emprestFinanc + balP.emprestFinancLP;

    var kpi3 = [
      { label:'Ativo Total', value: fmtBRL(bal.totalAtivo), sub:'ante '+periodoRefAnt(),
        delta: fmtChangePct(bal.totalAtivo, balP.totalAtivo), positive: bal.totalAtivo >= balP.totalAtivo },
      { label:'Patrimônio Líquido', value: fmtBRL(bal.totalPL), sub:'ante '+periodoRefAnt(),
        delta: fmtChangePct(bal.totalPL, balP.totalPL), positive: bal.totalPL >= balP.totalPL },
      { label:'Dívida Financeira (sem Floor Plan)', value: fmtBRL(dividaFinCur), sub:'Empréstimos e financiamentos, CP+LP',
        delta: fmtChangePct(dividaFinCur, dividaFinPrior), positive: dividaFinCur <= dividaFinPrior },
      { label:'Capital de Giro', value: fmtBRL(workingCapitalCur), sub:'Ativo Circ. − Passivo Circ.',
        delta: 'ante '+fmtBRL(workingCapitalPrior)+' em '+mesFinalRotulo().toLowerCase()+'/'+anoAnterior().slice(2), positive: workingCapitalCur >= workingCapitalPrior }
    ];
    body.appendChild(renderKpiGrid(kpi3));

    // O CHECK não é forçado a zero: o texto é montado a partir do valor real do
    // período selecionado, não de uma frase fixa por ano.
    var checkBalFecha = Math.abs(bal.check) <= 5;
    var calloutBal = checkBalFecha
      ? ('CHECK do Balanço (Ativo − Passivo − PL) fecha em '+periodoRef()+': '+fmtBRL(bal.check)+'.')
      : ('<b>CHECK do Balanço (Ativo − Passivo − PL) não fecha em '+periodoRef()+'</b>: '+fmtBRL(bal.check)+
         '. Isso foge do padrão de fechamento trimestral, que normalmente zera (ex.: '+periodoRefAnt()+': '+fmtBRL(balP.check)+
         '). Reportamos o valor tal como veio, sem forçar o fechamento; vale investigar a causa no Power BI.');
    body.appendChild(el('<div class="callout">'+calloutBal+'</div>'));

    var cols = document.createElement('div'); cols.className = 'two-col';

    // O Balanço é posição, não fluxo: cada coluna é uma data de fechamento.
    // Trimestral mostra a evolução dentro do ano selecionado; mensal e anual
    // comparam com o mesmo período do ano anterior.
    // Posições do período + a do ano anterior, e a diferença % entre a última
    // posição do ano atual e a do ano anterior (mesma data, um ano atrás).
    var colunasBal;
    if (state.period === 'trimestral'){
      // Meses de fechamento de trimestre dentro do ano selecionado: idx 2,5,8,11
      // (mar/jun/set/dez) — quantos couberem em MESES.length (2 no ano em curso,
      // 4 num ano fechado). O último sempre é o próprio `bal`, sem reconstrução.
      var idxTrimestres = [];
      for (var _qi = 2; _qi < MESES.length; _qi += 3) idxTrimestres.push(_qi);
      colunasBal = idxTrimestres.map(function(qi, ti){
        var mesNum = (qi+1 < 10 ? '0' : '') + (qi+1);
        var ehUltimo = (qi === MESES.length - 1);
        return { titulo: 'T'+(ti+1)+' ('+mesNum+'/'+anoAtual().slice(2)+')',
                  dados: ehUltimo ? bal : balancoNoMes(state.brand, qi, 0) };
      });
      colunasBal.push({ titulo:'Ano Anterior ('+periodoRefAnt()+')', dados: balP, ant:true });
    } else if (state.period === 'mensal'){
      colunasBal = [
        { titulo:'Atual ('+periodoRef()+')', dados: bal },
        { titulo:'Ano Anterior ('+periodoRefAnt()+')', dados: balP, ant:true }
      ];
    } else {                                    // anual: fecha o acumulado do exercício
      colunasBal = [
        { titulo: anoAtual()+(mesFinalNum()!=='12'?'*':'')+' ('+periodoRef()+')', dados: bal },
        { titulo: anoAnterior()+' ('+periodoRefAnt()+')', dados: balP, ant:true }
      ];
    }

    function buildSide(title, rowDefs){
      var side = document.createElement('div');
      side.appendChild(el('<div class="section-label">'+title+'</div>'));
      var tableWrap = document.createElement('div'); tableWrap.className = 'table-wrap';
      var table = document.createElement('table'); table.className = 'fin';
      var thead = document.createElement('thead');
      thead.innerHTML = '<tr><th>Conta</th>' +
        colunasBal.map(function(c){
          return '<th'+(c.ant?' class="ano-ant"':'')+'>'+c.titulo+'</th>';
        }).join('') + '<th class="ano-ant">Dif. %</th></tr>';
      table.appendChild(thead);
      // Compara a última posição de 2026 com a do ano anterior.
      var atualBal = colunasBal[colunasBal.length - 2].dados;
      var antBal   = colunasBal[colunasBal.length - 1].dados;
      var tbody = document.createElement('tbody');
      rowDefs.forEach(function(row){
        var tr = document.createElement('tr');
        tr.className = row.kind;
        var indentPx = 16 + row.indent*18;
        var a = row.get(atualBal), b = row.get(antBal);
        var delta = !b ? '–' : fmtDeltaPct((a - b) / Math.abs(b));
        tr.innerHTML = '<td style="padding-left:'+indentPx+'px">'+row.label+'</td>' +
          colunasBal.map(function(c){
            return '<td'+(c.ant?' class="ano-ant"':'')+'>'+fmtBRL(row.get(c.dados))+'</td>';
          }).join('') + '<td class="ano-ant">'+delta+'</td>';
        tbody.appendChild(tr);
      });
      table.appendChild(tbody);
      tableWrap.appendChild(table);
      side.appendChild(tableWrap);
      return side;
    }

    body.appendChild(el('<div class="section-label">Balanço Patrimonial — ' +
      (isAll() ? 'Consolidado' : state.brand) + '</div>'));
    cols.appendChild(buildSide('Ativo', ativoRowDefs));
    cols.appendChild(buildSide('Passivo e Patrimônio Líquido', passivoRowDefs));
    body.appendChild(cols);
  }

  function renderEndividamentoPage(){
    var body = document.getElementById('page-body');
    body.innerHTML = '';

    var dividaFinCur = bal.emprestFinanc + bal.emprestFinancLP;
    var dividaFinPrior = balP.emprestFinanc + balP.emprestFinancLP;
    var dividaLiqCur = ((bal.emprestFinanc + bal.emprestFinancLP) - bal.disponibilidades);
    var dividaLiqPrior = ((balP.emprestFinanc + balP.emprestFinancLP) - balP.disponibilidades);
    // Todos os X/EBITDA abaixo dependem de curYtd.ebitda/priorYtd.ebitda como denominador —
    // sem guarda, um período com EBITDA exatamente zero (empresa nova/sem atividade, ex.:
    // OMODA em 2025) vira 0÷0 = NaN, exibido como "NaNx". A conta em si vira 0 (sentinela
    // segura pra qualquer outro uso interno, tipo o gráfico de barras) e o card mostra "–".
    var temEbitdaCur = !!curYtd.ebitda;
    var temEbitdaPrior = !!priorYtd.ebitda;
    var temEbitdaAmbos = temEbitdaCur && temEbitdaPrior;
    var dividaBrutaEbitdaCur = temEbitdaCur ? dividaFinCur / curYtd.ebitda : 0;
    var dividaBrutaEbitdaPrior = temEbitdaPrior ? dividaFinPrior / priorYtd.ebitda : 0;
    var dividaLiqEbitdaCur = temEbitdaCur ? dividaLiqCur / curYtd.ebitda : 0;
    var dividaLiqEbitdaPrior = temEbitdaPrior ? dividaLiqPrior / priorYtd.ebitda : 0;
    // Mesmo problema do EBITDA=0 acima, aqui com Patrimônio Líquido no denominador
    // (ex.: empresa nova sem PL apurado ainda).
    var temPLCur = !!bal.totalPL;
    var temPLPrior = !!balP.totalPL;
    var temPLAmbos = temPLCur && temPLPrior;
    var dividaPLCur = temPLCur ? dividaFinCur / bal.totalPL : 0;
    var dividaPLPrior = temPLPrior ? dividaFinPrior / balP.totalPL : 0;
    // Floor Plan (estoque financiado de VN + VU + Peças) fica fora da "Dívida sem Floor
    // Plan" acima de propósito — aqui medimos o próprio Floor Plan contra o EBITDA.
    var floorPlanEbitdaCur = temEbitdaCur ? bal.floorPlan / curYtd.ebitda : 0;
    var floorPlanEbitdaPrior = temEbitdaPrior ? balP.floorPlan / priorYtd.ebitda : 0;
    // Sem dívida financeira, "% de curto prazo" não tem resposta (0 ÷ 0) — mostra
    // "–" em vez de NaN%, tanto no card quanto no gráfico de composição abaixo.
    var composicaoCPCur = dividaFinCur ? (bal.emprestFinanc / dividaFinCur) : null;
    var composicaoCPPrior = dividaFinPrior ? (balP.emprestFinanc / dividaFinPrior) : null;

    // EBIT e Despesas Financeiras acumulados — somam os meses reais da DRE do ano
    // selecionado; o ano anterior soma os mesmos meses (mesma consulta DAX).
    var ebitCurYtd = curYtd.ebit;
    var despFinCurYtd = -curYtd.despFin;      // despFin vem negativo no VALOR_AJUSTADO
    var ebitPriorYtd = priorYtd.ebit;
    var despFinPriorYtd = -priorYtd.despFin;
    var temDespFinCur = !!despFinCurYtd;
    var temDespFinPrior = !!despFinPriorYtd;
    var temDespFinAmbos = temDespFinCur && temDespFinPrior;
    var coberturaJurosCur = temDespFinCur ? ebitCurYtd / despFinCurYtd : 0;
    var coberturaJurosPrior = temDespFinPrior ? ebitPriorYtd / despFinPriorYtd : 0;

    // O gráfico de composição CP x LP só depende do período atual ter dívida — comparar
    // com o ano anterior é só para o delta do card, não deveria esconder o gráfico quando
    // só o ano anterior está zerado (ex.: dívida nova, sem histórico no ano anterior).
    var temComposicao = composicaoCPCur !== null;
    var temComparacaoCP = composicaoCPCur !== null && composicaoCPPrior !== null;
    var kpi5 = [
      { label:'Dívida Bruta sem Floor Plan / EBITDA', value: temEbitdaCur ? fmtRatioPrecise(dividaBrutaEbitdaCur) : '–', sub:'Em quantos anos de caixa a empresa paga tudo o que deve',
        delta: temEbitdaAmbos ? fmtChangePct(dividaBrutaEbitdaCur, dividaBrutaEbitdaPrior) : '', positive: temEbitdaAmbos ? dividaBrutaEbitdaCur <= dividaBrutaEbitdaPrior : true },
      { label:'Dívida Líquida sem Floor Plan / EBITDA', value: temEbitdaCur ? fmtRatioPrecise(dividaLiqEbitdaCur) : '–', sub:'Se a empresa usar todo o dinheiro para abater as dívidas,  quantos anos faltam para pagar o resto',
        delta: temEbitdaAmbos ? fmtChangePct(dividaLiqEbitdaCur, dividaLiqEbitdaPrior) : '', positive: temEbitdaAmbos ? dividaLiqEbitdaCur <= dividaLiqEbitdaPrior : true },
      { label:'Dívida Bruta sem Floor Plan / Patrimônio Líquido', value: temPLCur ? fmtRatioPrecise(dividaPLCur) : '–', sub:'Quanto do negócio é bancado por dinheiro emprestado',
        delta: temPLAmbos ? fmtChangePct(dividaPLCur, dividaPLPrior) : '', positive: temPLAmbos ? dividaPLCur <= dividaPLPrior : true },
      { label:'Floor Plan / EBITDA', value: temEbitdaCur ? fmtRatioPrecise(floorPlanEbitdaCur) : '–', sub:'Em quantos anos de caixa a empresa paga o floor plan de estoque',
        delta: temEbitdaAmbos ? fmtChangePct(floorPlanEbitdaCur, floorPlanEbitdaPrior) : '', positive: temEbitdaAmbos ? floorPlanEbitdaCur <= floorPlanEbitdaPrior : true },
      { label:'Composição (Curto Prazo)', value: temComposicao ? fmtPct(composicaoCPCur) : '–',
        sub:'Quanto da fatia da dívida precisa ser paga neste ano',
        delta: temComparacaoCP ? fmtPP(composicaoCPCur, composicaoCPPrior) : '',
        positive: temComparacaoCP ? composicaoCPCur <= composicaoCPPrior : true },
      { label:'Cobertura de Juros', value: temDespFinCur ? fmtRatioPrecise(coberturaJurosCur) : '–', sub:'Quanto o EBIT paga o juros sem sufocar o caixa',
        delta: temDespFinAmbos ? fmtChangePct(coberturaJurosCur, coberturaJurosPrior) : '', positive: temDespFinAmbos ? coberturaJurosCur >= coberturaJurosPrior : true }
    ];
    var kpiGrid5 = renderKpiGrid(kpi5);
    Array.prototype.forEach.call(kpiGrid5.children, function(card, i){
      if (!kpi5[i].delta) { var d = card.querySelector('.kpi-delta'); if (d) d.remove(); }
    });
    body.appendChild(kpiGrid5);

    if (temDespFinCur && coberturaJurosCur < 1) {
      body.appendChild(el('<div class="callout"><b>Cobertura de Juros abaixo de 1x</b>: o EBIT acumulado (R$ '+Math.round(ebitCurYtd).toLocaleString('pt-BR')+') não cobre as despesas financeiras do período (R$ '+Math.round(despFinCurYtd).toLocaleString('pt-BR')+'). Em '+janAte(anoAnterior())+' a cobertura era de '+(temDespFinPrior ? fmtRatioPrecise(coberturaJurosPrior) : '–')+'.</div>'));
    }

    body.appendChild(el('<div class="section-label">Composição da Dívida Financeira (Curto x Longo Prazo) — '+periodoRef()+'</div>'));
    var compPanel = document.createElement('div'); compPanel.className = 'panel';
    if (temComposicao) {
      var cpPct = Math.max(bal.emprestFinanc/dividaFinCur*100, 2);
      var lpPct = Math.max(bal.emprestFinancLP/dividaFinCur*100, 2);
      var stack = document.createElement('div');
      stack.style.cssText = 'display:flex;height:26px;border-radius:6px;overflow:hidden;width:100%';
      stack.innerHTML = '<div style="background:#C3002F;height:100%;width:'+cpPct+'%"></div>' +
        '<div style="background:#D6D6D6;height:100%;width:'+lpPct+'%"></div>';
      compPanel.appendChild(stack);
      var legend = el('<div class="legend" style="margin-top:14px"></div>');
      legend.appendChild(el('<div class="legend-item"><div class="legend-swatch" style="background:#C3002F"></div>Curto Prazo — '+fmtBRL(bal.emprestFinanc)+' ('+fmtPct(composicaoCPCur)+')</div>'));
      legend.appendChild(el('<div class="legend-item"><div class="legend-swatch" style="background:#D6D6D6"></div>Longo Prazo — '+fmtBRL(bal.emprestFinancLP)+' ('+fmtPct(1-composicaoCPCur)+')</div>'));
      compPanel.appendChild(legend);
      body.appendChild(compPanel);
      body.appendChild(el('<div class="footnote">A dívida financeira do grupo é quase toda de curto prazo — perfil típico de floor plan e capital de giro de revenda de veículos, mas que exige rolagem constante.</div>'));
    } else {
      compPanel.appendChild(el('<div style="color:var(--muted-1);font-size:13px">Sem dívida financeira em '+periodoRef()+' — nada para compor entre curto e longo prazo.</div>'));
      body.appendChild(compPanel);
    }

    body.appendChild(el('<div class="section-label">Dívida Líquida / EBITDA — Acumulado '+anoAtual()+' vs. Acumulado '+anoAnterior()+'</div>'));
    var panel2 = document.createElement('div'); panel2.className = 'panel';
    var bars2 = document.createElement('div'); bars2.className = 'hbars';
    var maxD = Math.max(dividaLiqEbitdaCur, dividaLiqEbitdaPrior, 0.001);
    [ {label:janAte(anoAtual()), value:dividaLiqEbitdaCur, color:'#C3002F', tem:temEbitdaCur}, {label:janAte(anoAnterior()), value:dividaLiqEbitdaPrior, color:'#D6D6D6', tem:temEbitdaPrior} ].forEach(function(d){
      var pct = Math.max(d.value/maxD*100, 2);
      var row = document.createElement('div'); row.className = 'hbar-row';
      row.innerHTML = '<div class="hbar-label">'+d.label+'</div>' +
        '<div class="hbar-track"><div class="hbar-fill" style="width:'+pct+'%;background:'+d.color+'"></div></div>' +
        '<div class="hbar-value">'+(d.tem ? fmtRatioPrecise(d.value) : '–')+'</div>';
      bars2.appendChild(row);
    });
    panel2.appendChild(bars2);
    body.appendChild(panel2);

    body.appendChild(renderGlossario('Como calculamos cada indicador', [
      { nome:'Dívida Bruta / EBITDA',
        explicacao:'Em quantos anos de caixa a empresa paga tudo o que deve.',
        formula:'(Empréstimos e Financiamentos de Curto e Longo Prazo) ÷ EBITDA',
        expectativa:'Quanto menor, melhor.' },
      { nome:'Dívida Líquida / EBITDA',
        explicacao:'Se a empresa usar todo o dinheiro disponível pra abater as dívidas, quantos anos faltam pra pagar o resto.',
        formula:'(Dívida Bruta − Caixa, Bancos e Aplicações) ÷ EBITDA',
        expectativa:'Quanto menor, melhor.' },
      { nome:'Dívida Bruta / Patrimônio Líquido',
        explicacao:'Quanto do negócio é movido por dinheiro emprestado, comparado ao dinheiro dos próprios donos.',
        formula:'Dívida Bruta ÷ Patrimônio Líquido',
        expectativa:'Maior que 1: o capital de terceiros financia mais que o capital próprio.' },
      { nome:'Floor Plan / EBITDA',
        explicacao:'Em quantos anos de caixa a empresa paga o estoque financiado (veículos novos, usados e peças).',
        formula:'(Floor Plan VN + Floor Plan VU + Floor Plan Peças) ÷ EBITDA',
        expectativa:'Quanto menor, melhor — mede o estoque financiado, à parte da dívida financeira.' },
      { nome:'Composição da Dívida (Curto Prazo)',
        explicacao:'Qual fatia da nossa dívida financeira precisa ser paga neste ano.',
        formula:'Empréstimos de Curto Prazo ÷ Dívida Financeira Total × 100',
        expectativa:'Quanto menor, melhor.' },
      { nome:'Cobertura de Juros',
        explicacao:'Quantas vezes o EBIT consegue pagar o custo dos juros do banco sem sufocar o caixa',
        formula:'EBIT ÷ Despesas Financeiras',
        expectativa:'Quanto maior, melhor.' }
    ]));
  }

  // Indicadores de Eficiencia na convencao oficial do modelo (relatorio_indicadores):
  // mes de referencia = ultimo mes do ano selecionado, saldo final do Balanco x fluxo do mes x 30 dias.
  function eficienciaDe(brand, idx){
    var d = detalheMeses(brand)[MESES.length - 1];   // ultimo mes do ano selecionado
    var b = balancoDe(brand, idx);
    var DIAS = 30;
    // No modelo os custos vem negativos; as formulas oficiais usam o valor positivo.
    var custoVN = -d.custoVN, custoVU = -d.custoVU, custoPecas = -d.custoPecas;
    var custoOficina = -d.custoOficina, custoTotal = -d.custoTotal;
    var custoPessoal = -(d.folha + d.gastosFunc), despOper = -d.despTotal;
    function div(a, b2){ return b2 ? a / b2 : 0; }
    return {
      giroVN: div(b.estVN, custoVN) * DIAS,
      giroVU: div(b.estVU, custoVU) * DIAS,
      giroPecas: div(b.estPecas, custoPecas + custoOficina) * DIAS,
      pmr: div(b.contasReceber, d.rl) * DIAS,
      pmp: div(b.fornecDiv, custoTotal) * DIAS,
      cicloFinanceiro: (div(b.contasReceber, d.rl) + div(b.estoques, custoTotal) - div(b.fornecDiv, custoTotal)) * DIAS,
      custoPessoalRL: div(custoPessoal, d.rl),
      despOperRL: div(despOper, d.rl)
    };
  }

  function renderEficienciaPage(){
    var body = document.getElementById('page-body');
    body.innerHTML = '';

    // Painel travado na ROYAL (nunca 'all'): o comparativo do ano anterior desta
    // seção só existe no Consolidado, então aqui `p` é sempre null.
    var c = eficienciaDe(state.brand, 0);
    var p = null;

    function card(label, valor, sub, delta, positivo){
      return { label:label, value:valor, sub:sub, delta:delta, positive:positivo };
    }
    var kpi6 = [
      card('Giro de Estoque — Veículos Novos', fmtDays(c.giroVN), 'menor é melhor',
           p ? fmtDiffDays(c.giroVN, p.giroVN) : '', p ? c.giroVN <= p.giroVN : c.giroVN >= 0),
      card('Giro de Estoque — Veículos Usados', fmtDays(c.giroVU), 'menor é melhor',
           p ? fmtDiffDays(c.giroVU, p.giroVU) : '', p ? c.giroVU <= p.giroVU : c.giroVU >= 0),
      card('Giro de Estoque — Peças', fmtDays(c.giroPecas), 'menor é melhor',
           p ? fmtDiffDays(c.giroPecas, p.giroPecas) : '', p ? c.giroPecas <= p.giroPecas : c.giroPecas >= 0),
      card('Prazo Médio de Recebimento', fmtDays(c.pmr), 'menor é melhor',
           p ? fmtDiffDays(c.pmr, p.pmr) : '', p ? c.pmr <= p.pmr : true),
      card('Prazo Médio de Pagamento', fmtDays(c.pmp), 'maior financia o giro',
           p ? fmtDiffDays(c.pmp, p.pmp) : '', p ? c.pmp >= p.pmp : true),
      card('Ciclo Financeiro', fmtDays(c.cicloFinanceiro), 'PMR + giro − PMP',
           p ? fmtDiffDays(c.cicloFinanceiro, p.cicloFinanceiro) : '', p ? c.cicloFinanceiro <= p.cicloFinanceiro : true),
      card('Custo de Pessoal / Receita Líquida', fmtPct(c.custoPessoalRL), 'Folha + Gastos c/ Funcionários',
           p ? fmtPP(c.custoPessoalRL, p.custoPessoalRL) : '', p ? c.custoPessoalRL <= p.custoPessoalRL : true),
      card('Despesas Operacionais / Receita Líquida', fmtPct(c.despOperRL), '',
           p ? fmtPP(c.despOperRL, p.despOperRL) : '', p ? c.despOperRL <= p.despOperRL : true)
    ];
    var grid = renderKpiGrid(kpi6);
    Array.prototype.forEach.call(grid.children, function(cardEl, i){
      if (!kpi6[i].delta) { var dEl = cardEl.querySelector('.kpi-delta'); if (dEl) dEl.remove(); }
      var sEl = cardEl.querySelector('.kpi-sub'); if (sEl && !sEl.textContent) sEl.remove();
    });
    body.appendChild(grid);
  }

  function renderPlaceholderPage(title){
    var body = document.getElementById('page-body');
    body.innerHTML = '';
    var card = document.createElement('div');
    card.className = 'placeholder-card';
    card.innerHTML = '<b>'+title+' — em construção</b>Essa parte do painel entra numa próxima etapa, com os mesmos dados reais do Power BI. Por ora, confirme a Visão Geral antes de seguirmos.';
    body.appendChild(card);
  }

  function render(){
    aplicarAno(state.ano);
    recomputar(state.brand);
    document.getElementById('sidebar-foot').innerHTML =
      'Dados reais · Power BI<br>Base até ' + periodoRef() + '<br>Snapshot de ' + SNAPSHOT;

    renderNavGroup(document.getElementById('nav-visao'), navVisao);
    renderNavGroup(document.getElementById('nav-relatorios'), navRelatorios);
    renderNavGroup(document.getElementById('nav-indicadores'), navIndicadores);
    renderAnoToggle();
    renderPeriodToggle();

    var allNav = navVisao.concat(navRelatorios, navIndicadores);
    var current = allNav.filter(function(n){ return n.id === state.page; })[0];
    document.getElementById('page-eyebrow').textContent = isAll()
      ? 'Consolidado — Todas as Empresas'
      : 'Empresa: ' + state.brand;
    document.getElementById('page-title').textContent = current.label;
    document.getElementById('page-desc').textContent = (state.page === 0)
      ? 'Indicadores consolidados de resultado — real, ' + janAte(anoAtual()) + ' (acumulado no ano) contra ' + janAte(anoAnterior()) + '.'
      : pageDescs[state.page];

    if (state.page === 0) renderOverviewPage();
    else if (state.page === 1) renderDrePage();
    else if (state.page === 2) renderFluxoCaixaPage();
    else if (state.page === 3) renderBalancoPage();
    else if (state.page === 4) renderRentabilidadePage();
    else if (state.page === 5) renderEndividamentoPage();
    else if (state.page === 6) renderEficienciaPage();
    else renderPlaceholderPage(current.label);

    // Rodapé do painel: última linha de qualquer página.
    document.getElementById('page-body').appendChild(
      el('<div class="page-updated">Atualizado até a data de ' + SNAPSHOT + '</div>'));

    // Replay da animação de entrada a cada render() (troca de página, filtro de período,
    // expandir/colapsar drill-down etc.). Os KPI cards já reanimam sozinhos (são elementos
    // novos a cada render); o page-body precisa do truque de reflow porque é o mesmo nó DOM
    // reaproveitado — só trocar innerHTML não reinicia uma animação CSS.
    var pageBody = document.getElementById('page-body');
    pageBody.classList.remove('page-fade');
    void pageBody.offsetWidth;
    pageBody.classList.add('page-fade');
  }

  render();
})();
</script>
