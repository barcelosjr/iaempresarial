# =============================================================================
# Responsáveis por caixa — destinatários da DMF
# =============================================================================
# QUEM RECEBE A DMF: o responsável pelo caixa da REVENDA onde foi feito o
# lançamento que levou o acumulado do cliente a atingir o limiar.
#
# A apuração é sempre do GRUPO INTEIRO (soma todas as empresas e revendas, para
# pegar fracionamento entre lojas), mas a cobrança vai para UM destinatário: o
# do caixa do lançamento decisivo. Um cliente que comprou em cinco lojas gera
# uma cobrança, não cinco.
#
# Os anexos são uma DMF POR EMPRESA do grupo em que houve recebimento.
# O setor de COAF (email_coaf) recebe as mesmas DMFs MAIS o relatório
# consolidado do grupo — que não vai para mais ninguém.
#
# MAIS DE UM RESPONSÁVEL NO MESMO CAIXA: separe os e-mails por vírgula no
# mesmo campo `email:`. Todos recebem a mesma mensagem, no mesmo "Para".
#   email: "fulano@empresa.com, ciclana@empresa.com"
#
# ATENÇÃO — CONFIGURAÇÃO DE TESTE (controladoria3@kobeveiculos.com.br):
# todas as 48 combinações revenda + caixa apontam para o mesmo endereço.
# Troque pelos responsáveis reais antes de entrar em produção.
#
# Caixas 9, 99 e 4 (e 8/14 na Multicar Mits) não representam saldo real, mas
# entram na apuração do COAF por decisão do gestor — os lançamentos saem
# marcados no PDF.
# =============================================================================

# Recebe o relatório consolidado do grupo + todas as DMFs por empresa.
